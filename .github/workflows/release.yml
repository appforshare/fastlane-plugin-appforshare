name: Release

# Publishes the gem to RubyGems through Trusted Publishing (OIDC), so no API key or OTP is stored.
# Runs on a version tag (vX.Y.Z) or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # Exchange the GitHub OIDC token for a short lived RubyGems key. Done by hand because the first push of a new
      # gem needs the owning account ID (`owner`), which the released rubygems actions do not send yet.
      - name: RubyGems credentials
        env:
          OWNER_ID: ${{ vars.RUBYGEMS_OWNER_ID }}
        run: |
          JWT=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          BODY=$(jq -n --arg jwt "$JWT" --arg owner "$OWNER_ID" 'if $owner == "" then {jwt: $jwt} else {jwt: $jwt, owner: $owner} end')
          RES=$(curl -s -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H 'Content-Type: application/json' -H 'Accept: application/json' -d "$BODY")
          KEY=$(echo "$RES" | jq -r '.rubygems_api_key // empty')
          if [ -z "$KEY" ]; then echo "$RES"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "GEM_HOST_API_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Build and push
        run: |
          gem build fastlane-plugin-appforshare.gemspec
          gem push fastlane-plugin-appforshare-*.gem
